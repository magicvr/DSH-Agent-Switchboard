# Agent Switchboard 的 bundle 层。
#
# 本条目**启用但不携带 config**。这个组合是刻意的，理由是两条实测约束的交集：
#
# ## 为什么必须启用（而不是 disabled: true）
#
# DSH 的客户端模块系统扫描客户端插件时**直接跳过 disabled 条目**
# （`dsh-client-modules/lib/index.js` 第 836 行：
#   `if (entry.options.name !== entryName || entry.fiber === void 0 || entry.disabled) continue;`）
# 而且它由 `internal/plugin` 事件驱动，禁用条目不会触发该事件，因此包名根本不会
# 进入它的扫描集合。实测后果：`disabled: true` 时本插件的设置页在 GUI 里**完全不出现**，
# 且没有任何报错（因为压根没走到报错路径）。
#
# 用户已明确选择「设置页**始终可见**」（见 decisions.md D13）：任何人都应能在
# Settings 里配置角色与派发机制，而不必先选中某个 preset。这要求条目启用。
#
# ## 为什么**不携带 config**
#
# 角色定义（roles）的权威存储是 `$DSH_HOME/agent-switchboard/roles.json`，而它由设置页
# **间接**写入：客户端唯一可写通道是 `settings.mutate(ns, …)`，其 `ns` 只能是根条目 id
# （preset 内的插件声明没有 settings 行）。因此 UI 写的是**根条目的配置**，再由根实例
# 把它同步进那个文件；preset 实例只声明 `mount: true` 并从文件读取角色。
# 本文件若也写 config，就会与 UI 写入的那份产生**两份真相**。
#
# 本条目启用后，Host 半边会在根作用域被激活，但 config 为空、`mount` 为默认的 `false`
# → `apply` 走根条目分支：只把配置同步到 roles 文件，**不挂载任何角色工具、不注入角色
# 路由指引、也不注册任何 Cordis 服务**（客户端改走 `settings`）。
# 即**根作用域下它只承担配置桥接**；角色工具真正生效仍在声明了 `mount: true` 的
# preset 会话里。根作用域可见的另一产物是 `switchboard_selftest` 自检工具——它刻意在
# `mount` 判断**之前**注册，以便配置出错时仍有诊断入口。
#
# ## 另一个不能用错的地方
#
# 同包名**多个活跃 Loader 来源**会被客户端模块系统拒绝
# （第 874-876 行：`package <name> resolves from multiple active Loader sources`）。
# 因此不要再往 profile 里加第二个指向本包的条目；preset 里的那份声明是 preset
# 作用域的构成清单，不计入这个去重判定。
- insert:
    - id: agent-switchboard
      name: '@magicvr/dsh-agent-switchboard'

# Agent Switchboard 的 bundle 层。
#
# ⚠️ 本条目**以 `disabled: true` 声明**，即默认不激活。
#
# 设计取向（用户明确要求）：本插件**不装载即生效**，而是作为一个 Agent preset ——
# 只有使用该 preset 的会话才挂载角色工具；其他会话里本插件等于不存在。
#
# 实现方式（两者缺一不可）：
#   1. 本文件把条目声明为 disabled —— 保证它不会在根作用域被激活；
#   2. preset 声明在同包的 `presets/switchboard.patch.yml`（由 package.json 的
#      `dsh.bundle.patch` 数组列在主 patch 之后），其 `plugins` 列表里包含本包本身，
#      因此插件只在**选中该 preset 的会话作用域**内被实例化。
#
# 为什么必须显式 disabled，而不是把本文件写成空数组（已实测，见
# docs/architecture.md 3.1d 第 21 条）：
#   Loader 按**包名**处理。若本包同时被全局挂载（哪怕条目本身没写 disabled），
#   preset 里那一条就不会生效 —— 实测表现是插件在根作用域被激活，所有会话都能
#   看到它的工具。
#
# 为什么不用空数组 `[]`：`[]` 在语法上是合法的 YAML，但官方全部 bundle patch
# 都是非空列表，存在空数组的先例为 0。用一条明确的 disabled 条目比用一个未经验证
# 的空形态更稳妥，且语义更清楚（「声明了，但默认不启用」）。
#
# 若需要临时在**全部**会话里启用（仅调试用），把下面那行改为 `disabled: false`，
# 并在 profile 的 cordis.patch.yml 里给出对应 config —— 那会让本插件对所有会话
# 生效，与该设计取向相反。
- insert:
    - id: agent-switchboard
      name: '@magicvr/dsh-agent-switchboard'
      disabled: true
